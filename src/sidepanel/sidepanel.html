<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>AI Reader</title>
    <link rel="stylesheet" href="sidepanel.css">
  </head>
  <body>
    <header>
      <div>
        <p class="eyebrow">IN-PAGE AI READER</p>
        <h1>AI Reader</h1>
      </div>
      <span id="connection-badge" class="badge offline">未连接</span>
    </header>

    <main>
      <section class="card settings">
        <label class="mode-label">使用方式
          <select id="connection-mode">
            <option value="volcengine">火山直连（推荐）</option>
            <option value="opencode">OpenCode（高级）</option>
          </select>
        </label>
        <details>
          <summary>连接设置</summary>
          <div id="volcengine-settings" class="settings-grid">
            <label>Base URL<input id="volcengine-base-url" value="https://ark.cn-beijing.volces.com/api/v3" spellcheck="false"></label>
            <label>API Key<input id="volcengine-api-key" type="password" autocomplete="off" placeholder="保存在当前浏览器的本地配置"></label>
            <label>模型<select id="volcengine-model" disabled><option value="">连接后自动读取模型</option></select></label>
            <label id="volcengine-custom-model-row" hidden>Model ID<input id="volcengine-custom-model-id" spellcheck="false" placeholder="例如 endpoint 或模型 ID"></label>
            <p id="volcengine-model-hint" class="privacy-note">连接后会自动读取可用模型。</p>
            <p class="privacy-note">API Key 会保存在当前浏览器扩展的本地配置中，请仅在可信电脑上使用。</p>
          </div>
          <div id="opencode-settings" class="settings-grid" hidden>
            <label>OpenCode 地址<input id="server-url" value="http://127.0.0.1:4096" spellcheck="false"></label>
            <label>用户名<input id="username" value="opencode" autocomplete="username"></label>
            <label>服务密码<input id="password" type="password" autocomplete="current-password" placeholder="仅保存在当前浏览器会话"></label>
            <div class="model-row">
              <label>Provider<select id="provider" disabled><option>请先连接</option></select></label>
              <label>Model<select id="model" disabled><option>请先连接</option></select></label>
            </div>
          </div>
          <label>单块字符上限<input id="chunk-chars" type="number" min="1000" max="48000" step="1000" value="12000"></label>
          <button id="connect" class="secondary">连接并读取模型</button>
        </details>
      </section>

      <section class="quick-actions">
        <button id="translate" class="primary-wide" disabled>翻译当前网页</button>
        <button id="restore" class="secondary" disabled>显示原文</button>
      </section>

      <section class="card article-card">
        <div class="section-title">
          <div>
            <p class="eyebrow">CURRENT PAGE</p>
            <h2 id="article-title">尚未抽取网页</h2>
          </div>
          <button id="extract" class="ghost">重新读取</button>
        </div>
        <p id="article-meta" class="muted">点击“翻译当前网页”后会自动读取并开始翻译。</p>
      </section>

      <section class="actions">
        <button id="analyze" disabled>全文分析</button>
        <button id="copy" class="secondary" disabled>复制结果</button>
      </section>

      <section class="ask-row">
        <textarea id="question" rows="2" placeholder="针对全文提问……" disabled></textarea>
        <button id="ask" disabled>提问</button>
      </section>

      <section class="card result-card">
        <div class="section-title">
          <div>
            <p id="phase" class="eyebrow">READY</p>
            <h2>阅读结果</h2>
          </div>
          <div class="compact-actions">
            <button id="stop" class="danger" disabled>停止</button>
            <button id="export" class="ghost" disabled>导出</button>
          </div>
        </div>
        <div id="progress" class="progress" hidden><span></span></div>
        <pre id="output">配置模型后，点击“翻译当前网页”即可开始。</pre>
        <div id="sources" class="sources"></div>
        <div id="error" class="error" hidden></div>
      </section>
    </main>
    <script type="module" src="sidepanel.js"></script>
  </body>
</html>
